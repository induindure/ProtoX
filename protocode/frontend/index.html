<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script>
      // ProtoX theme: apply before the app loads (no flash). ?theme= carries it between modules.
      (function () {
        try {
          var fromUrl = new URLSearchParams(location.search).get('theme')
          var t = fromUrl || localStorage.getItem('protox-theme')
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          if (fromUrl) localStorage.setItem('protox-theme', t)
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
